<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajax Project</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav>
    <span class="logo">Ajax Project</span>
    <a href="/logout" class="btn-sm">Sign out</a>
  </nav>
  <main>
    <section class="card">
      <div class="row between">
        <h2>Overview</h2>
        <span id="badge" class="badge {{ 'on' if a.is_active else 'off' }}">
          {{ 'Active' if a.is_active else a.reason|title }}
        </span>
      </div>
      <div class="stats">
        <div>
          <div class="val" id="used">{{ a.used_gb }}</div>
          <div class="lbl">Used GB</div>
        </div>
        <div>
          <div class="val" id="limit">{{ a.limit_gb }}</div>
          <div class="lbl">Limit GB</div>
        </div>
        <div>
          <div class="val" id="days">{{ a.days_left }}</div>
          <div class="lbl">Days left</div>
        </div>
        <div>
          <div class="val" id="online">{{ '●' if a.is_online else '○' }}</div>
          <div class="lbl">Live</div>
        </div>
      </div>
      <div class="bar"><div id="bar" style="width:{{ a.percent }}%"></div></div>
      <div class="muted center" id="addr-line"></div>
    </section>
    <section class="card">
      <h2>Settings</h2>
      <div class="row gap">
        <button onclick="toggle()" id="btn-toggle" class="btn">
          {{ 'Disable' if a.is_active else 'Enable' }}
        </button>
        <button onclick="resetUsage()" class="btn warn">Reset usage</button>
        <button onclick="restartAll()" class="btn-sm">Reload</button>
      </div>
      <form id="form-update" class="form-inline" onsubmit="return saveSettings(event)">
        <label>Limit GB</label>
        <input type="number" id="limit_in" value="{{ a.limit_gb }}" min="1" step="1">
        <label>Days</label>
        <input type="number" id="days_in" value="{{ a.expire_days }}" min="1" step="1">
        <button type="submit" class="btn">Save</button>
      </form>
    </section>
    <section class="card">
      <div class="row between">
        <h2>Links</h2>
        <button onclick="loadLinks()" class="btn-sm">Refresh</button>
      </div>
      <div id="feed-box" class="sub-box" style="display:none">
        <label>Feed URL</label>
        <div class="copy-row">
          <input type="text" id="feed-url" readonly>
          <button onclick="copy('feed-url')" class="btn-sm">Copy</button>
        </div>
      </div>
      <div id="links" class="configs"></div>
    </section>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
